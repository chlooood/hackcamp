<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>

  /* presenter */

  .banner { position: fixed; z-index: 21; left: 30vw; top: 50%; transform: translate(-50%,-50%) scale(.6); opacity: 0; pointer-events: none; text-align: center; color: #fff; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .15s; display: flex; flex-direction: column; align-items: center; gap: 1vh; }

  .banner .ti { font-size: clamp(44px, 6.4vw, 110px); font-weight: 900; line-height: 1; }
  .banner .pl { width: clamp(90px, 9vw, 150px); }
  /* in-chapter: game-y slide */

  .node.circle b { border-radius: 50%; } .node.square b { border-radius: 8px; } .node.diamond b { border-radius: 6px; transform: rotate(45deg); } .node.diamond b span { transform: rotate(-45deg); } .node.hex b { border-radius: 30%; } .node.flag b { border-radius: 50% 50% 50% 8px; }

  .node.here b { border-color: var(--orange); background: #FFEDD5; }
  .node em { position: absolute; top: 44px; white-space: nowrap; font-style: normal; font-size: 12px; font-weight: 900; color: var(--muted); }
  .node.here em { color: var(--ink); }
  .hero { position: absolute; top: -34px; width: 46px; margin-left: -23px; transition: left 1s cubic-bezier(.5,0,.2,1); z-index: 2; }
  .hero.hopping { animation: hopping 1s ease-in-out; }
  @keyframes hopping { 0%,100% { transform: translateY(0); } 25%,75% { transform: translateY(-14px) rotate(-6deg); } 50% { transform: translateY(0) scale(1.1,.9); } }
  /* quest complete */
  .confetti { position: fixed; left: 0; top: 0; bottom: 0; width: 60vw; z-index: 4; pointer-events: none; overflow: hidden; }

  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

  .notes { position: fixed; left: 2vw; right: 2vw; bottom: 2vh; background: #1F2424; color: #F1F4F4; border-radius: 16px; padding: 14px 18px; font-size: 17px; line-height: 1.45; font-weight: 700; display: none; z-index: 10; max-width: 60rem; }
  .notes.on { display: block; }
  .notes b { color: #8EE3D8; }
  .notes .meta { display: flex; gap: 16px; font-size: 13px; color: #A9B6B6; margin-bottom: 6px; }
  .timer { position: fixed; top: 2vh; right: 2vw; font-size: 15px; font-weight: 900; color: var(--muted); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; display: none; font-variant-numeric: tabular-nums; z-index: 10; }
  .timer.on { display: block; }
  .timer.over { color: #fff; background: #C0312B; border-color: #C0312B; }
  .help { position: fixed; bottom: 2vh; left: 2vw; font-size: 13px; font-weight: 800; color: var(--muted); background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; z-index: 10; display: none; line-height: 1.6; }
  .help.on { display: block; }
  .ploopy-fidget { display: flex; gap: 1vw; align-items: flex-end; }
  .ploopy-fidget button { background: none; border: 0; padding: 0; cursor: pointer; transition: transform .12s; }
  .ploopy-fidget button:active, .ploopy-fidget button.squish { animation: squish .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes squish { 0% { transform: scale(1,1); } 30% { transform: scale(1.18,.78); } 60% { transform: scale(.92,1.1); } 100% { transform: scale(1,1); } }
  .pl { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .spark { position: absolute; width: clamp(28px, 3vw, 52px) !important; height: auto; }
  .go .pop { animation: popin .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes popin { 0% { transform: scale(.4) translateY(20px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .go .bob { animation: popin .6s cubic-bezier(.3,1.6,.5,1) both, bob 2.4s ease-in-out .8s infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-3deg); } }
  .crowd { display: flex; align-items: flex-end; gap: 1.6vw; margin: 1vh 0 0; }
  .crowd .who { position: relative; }
  .crowd .pl { width: clamp(80px, 9vw, 160px); }
  .crowd .who.dim .pl { opacity: .55; filter: saturate(.4); }
  .crowd .who.me .pl { width: clamp(100px, 11vw, 200px); }
  .card { background: #fff; border-radius: 28px; padding: clamp(18px, 2.4vw, 36px); box-shadow: 0 10px 30px rgba(20,60,60,.07); }
  .night { background: #141C30; color: #fff; border-radius: 28px; padding: clamp(18px, 2.4vw, 36px); position: relative; }
  .night .t { color: #fff; }
  .rider { position: absolute; top: 50%; transform: translate(-50%, -58%); width: clamp(46px, 4.4vw, 76px); transition: left 1s cubic-bezier(.2,.8,.2,1); left: 0; }
  .go .rider { left: var(--w); }
  .track { position: relative; overflow: visible !important; }
  .track .fill { overflow: hidden; }
  .vbar .pl { width: 82%; margin-bottom: -10px; position: relative; z-index: 1; }
  .phone-wrap { transition: opacity .3s; }
  body.nophone.intro-done .phone-wrap { opacity: 1; transition: opacity .8s; }
  .opener { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 3vw; }
  .opener svg.bodyart { height: 76vh; filter: drop-shadow(0 18px 30px rgba(20,60,60,.10)); width: auto; overflow: visible; }
  .opener .tail { display: flex; flex-direction: column; gap: 1.6vh; opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s cubic-bezier(.3,1.5,.5,1); }
  .opener.done .tail { opacity: 1; transform: none; }
  .opener .tail h1 { font-size: clamp(28px, 3vw, 54px); white-space: nowrap; }
  .opener .mark { font-size: clamp(72px, 11vw, 190px); font-weight: 900; color: var(--teal); line-height: .9; margin: 0; letter-spacing: -0.02em; }
  .bodyart .food { transition: transform .15s; transform-origin: 128px 150px; }
  .bodyart .bite { opacity: 0; } .bodyart.b1 .bite.a, .bodyart.b2 .bite.b, .bodyart.b2 .bite.a { opacity: 1; }

  .bodyart .trail { fill: none; stroke: #0D9488; stroke-width: 5; stroke-dasharray: none; opacity: .9; stroke-linecap: round; stroke-linejoin: round; }
  .bodyart .mouth { transform-origin: 189px 151px; transition: transform .12s; }

  .bodyart .stomach { transform-origin: 290px 356px; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }

  .bodyart .tag.on { opacity: 1; }
  body.nophone .words { gap: 1.8vh; }
  body.nophone .words h1 { font-size: clamp(30px, 3.6vw, 60px); }
  body.nophone .words .big { font-size: clamp(56px, 8.5vw, 150px); }
  .words { max-height: 81vh; }
  body.nophone .phone-wrap { opacity: .35; }
  .chart { display: flex; flex-direction: column; gap: 2.2vh; width: 100%; max-width: 64rem; margin-top: 1vh; }
  .hbar { display: grid; grid-template-columns: clamp(80px, 9vw, 150px) minmax(0, 1fr); align-items: center; gap: 1.6vw; }
  .hbar .n { font-size: clamp(36px, 4.6vw, 80px); font-weight: 900; color: var(--teal); line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .hbar .lab { font-size: clamp(16px, 1.6vw, 26px); font-weight: 800; line-height: 1.25; margin-bottom: 14px; }
  .chart.card { gap: 3.4vh; }
  .track { height: clamp(20px, 2.6vh, 30px); background: #D5F5F0; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .fill.alt { background: var(--orange); }
  .go .fill { width: var(--w); }
  .vbars { display: flex; align-items: flex-end; gap: 3vw; height: 38vh; }
  .vbars.card { padding-bottom: clamp(14px, 2vh, 24px); }
  .vbar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; height: 100%; width: clamp(90px, 9vw, 160px); }
  .vbar .col { width: 100%; height: 0; background: var(--teal); border-radius: 18px 18px 6px 6px; transition: height 1s cubic-bezier(.2,.8,.2,1); }
  .vbar .col.x { }
  .vbars .vbar .col { background: #8C93D9; flex-shrink: 0; }
  .vbars .vbar.m .col { background: #8FA77A; }
  .go .vbar .col { height: var(--h); }
  .vbar .n { font-size: clamp(30px, 3.6vw, 64px); font-weight: 900; line-height: 1; }
  .vbar .lab { font-size: clamp(15px, 1.4vw, 22px); font-weight: 800; color: var(--muted); }
  .split { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5vw; align-items: end; width: 100%; }
  .forest { display: flex; flex-direction: column; gap: 14px; }
  .forest svg:not(.spark) { width: 100%; height: auto; overflow: visible; }
  .forest .t { font-size: clamp(16px, 1.5vw, 24px); font-weight: 800; line-height: 1.3; }
  .timeline { width: 100%; max-width: 70rem; }
  .timeline svg { width: 100%; height: auto; overflow: visible; }
  .tag { display: inline-block; font-size: 0.8em; font-weight: 900; background: #FFEDD5; color: #7A3A00; border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
  @media (prefers-reduced-motion: reduce) { .fill, .vbar .col { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .ring.on, .ploopy-fidget button.squish { animation: none; } }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; justify-items: center; overflow: auto; } .phone-wrap { height: 70vh; } }
</style>

<div class="stage" id="stageEl">
  <div class="words" id="words" aria-live="polite"></div>
  <div class="phone-wrap" id="phoneWrap">
    <div class="phone"><div class="screen" id="screen"><div class="notch"></div><iframe id="app" title="Plop app, live"></iframe></div></div>
    <div class="ring" id="ring"></div>
    <div class="tap" id="tap">tap</div>
  </div>
</div>
<div class="world" id="world" aria-hidden="true"><div class="dots"></div>
  <div class="shape s-circle" style="left:-9vh;bottom:-9vh;top:auto"></div>
  <div class="shape s-half" style="left:42%;bottom:-1px;top:auto"></div>
  <div class="shape s-square" style="right:-5vh;bottom:-5vh;left:auto;top:auto;transform:rotate(14deg)"></div>
  <div class="shape s-pill" style="left:52%;top:-3.5vh"></div>
  <div class="shape s-tri" style="right:31vw;top:44%;left:auto;transform:rotate(-12deg)"></div>
</div>
<div class="hud" id="hud" aria-label="Quest progress"></div>
<div class="wipe" id="wipe" aria-hidden="true"></div>
<div class="banner" id="banner" aria-live="polite"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="timer" id="timer">0:00</div>
<div class="help" id="help">→ / Space: next &nbsp; ←: back<br>N: notes &nbsp; T: timer &nbsp; R: reset app<br>Phone is the real app. Tap it any time.</div>
<div class="notes" id="notes"></div>

    document.body.classList.remove('intro-done');
    if (s.intro) playOpener();
    ringSel = null; placeRing(); if (s.phone === false) { document.getElementById('ring').classList.remove('on'); document.getElementById('tap').classList.remove('on'); }
    setTimeout(function () { if (s.ring && s.phone !== false) ringOn(s.ring[0], s.ring[1]); }, 450);
    var t = STEPS.slice(0, i).reduce(function (a, b) { return a + b.secs; }, 0);
    document.getElementById('notes').innerHTML = '<div class="meta"><span>' + (i + 1) + ' of ' + STEPS.length + '</span><span>~' + s.secs + 's</span><span>should be at ' + fmt(t) + '</span></div>' + s.notes;
    if (!started && i > 0) started = Date.now();
    busy = false;
  }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  setInterval(function () {
    var el = document.getElementById('timer'), sec = started ? (Date.now() - started) / 1000 : 0;
    el.textContent = fmt(sec) + ' / 4:00'; el.classList.toggle('over', sec > 240);
  }, 500);

  function playOpener() {
    var art = document.getElementById('bodyart'), op = document.getElementById('opener');
    if (!art) return;
    var t = function (ms, f) { setTimeout(function () { if (document.getElementById('bodyart') === art) f(); }, motionOK() ? ms : 0); };
    var trail = document.getElementById('trail'), len = trail.getTotalLength();
    trail.style.strokeDasharray = len; trail.style.strokeDashoffset = len;
    if (!motionOK()) { trail.style.strokeDashoffset = 0; art.classList.add('gone', 'born'); op.classList.add('done'); document.body.classList.add('intro-done'); return; }
    var tag = function (id, on) { var e = document.getElementById(id); if (e) e.classList.toggle('on', on); };
    t(300, function () { art.classList.add('b1', 'chew'); tag('tag1', true); });
    t(450, function () { art.classList.remove('chew'); });
    t(650, function () { art.classList.add('b2', 'chew'); });
    t(800, function () { art.classList.remove('chew'); });
    t(1000, function () {
      art.classList.add('gone'); tag('tag1', false);
      var b = document.getElementById('bolus'); b.setAttribute('opacity', '1');
      document.getElementById('travel').beginElement();
      trail.style.transition = 'stroke-dashoffset 3.4s cubic-bezier(.35,0,.65,1)'; trail.style.strokeDashoffset = 0;
    });
    t(1900, function () { art.classList.add('squish'); tag('tag2', true); });
    t(2300, function () { art.classList.remove('squish'); });
    t(2700, function () { tag('tag2', false); tag('tag3', true); });
    t(4300, function () { tag('tag3', false); document.getElementById('bolus').setAttribute('opacity', '0'); art.classList.add('born'); });
    t(4900, function () { op.classList.add('done'); });
    t(5500, function () { document.body.classList.add('intro-done'); });
  }

  function buildFidget() {
    var box = document.getElementById('fidget'); if (!box) return;
    var names = Object.keys(PLOOPY).filter(function (k) { return PLOOPY[k].hello && PLOOPY[k].cheer; });
    if (!names.length) { box.remove(); return; }
    box.innerHTML = names.map(function (k) {
      return '<button aria-label="Squish the ' + k + ' Ploopy" data-k="' + k + '"><img alt="" src="' + PLOOPY[k].hello + '" style="height:clamp(48px,6vw,100px)"></button>';
    }).join('');
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var p = PLOOPY[b.dataset.k], img = b.querySelector('img');
      b.classList.remove('squish'); void b.offsetWidth; b.classList.add('squish');
      img.src = p.cheer; setTimeout(function () { img.src = p.hello; }, 700);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); show(i + 1, true); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); show(i - 1, false); }
    else if (k === 'n' || k === 'N') document.getElementById('notes').classList.toggle('on');
    else if (k === 't' || k === 'T') document.getElementById('timer').classList.toggle('on');
    else if (k === 'r' || k === 'R') { bootApp(STEPS[Math.max(i, 0)].route || 'home'); }
    else if (k === '?' || k === 'h' || k === 'H') document.getElementById('help').classList.toggle('on');
  });
  // keys keep working after someone taps the phone
  iframe.addEventListener('load', function () {
    try { iframe.contentDocument.addEventListener('keydown', function (e) {
      if (['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'n', 'N', 't', 'T', 'r', 'R', '?', 'h', 'H'].indexOf(e.key) >= 0) {
        e.preventDefault(); document.dispatchEvent(new KeyboardEvent('keydown', { key: e.key }));
      }
    }); } catch (err) {}
  });

  bootApp('home');
  fitPhone(); setTimeout(fitPhone, 300);
  show(0);
  document.getElementById('help').classList.add('on');
  setTimeout(function () { document.getElementById('help').classList.remove('on'); }, 5000);
  window.__pitch = { show: function (n) { return show(n, true); }, next: function () { return show(i + 1, true); }, get i() { return i; } };
})();
</script>
