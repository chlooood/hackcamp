<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plop pitch</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --teal:#0D9488; --teal-dark:#0B6E64; --ink:#1F2424; --muted:#5F6B6B; --bg:#F4F6F6; --line:#E3E8E8; --orange:#F97316; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .stage { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4vw; padding: 4vh 6vw; }
  .words { display: flex; flex-direction: column; gap: 2.4vh; max-width: 54rem; }
  .words h1 { font-size: clamp(34px, 5.2vw, 88px); line-height: 1.04; font-weight: 900; margin: 0; letter-spacing: -0.01em; }
  .words p { font-size: clamp(18px, 2vw, 32px); line-height: 1.35; font-weight: 700; color: var(--muted); margin: 0; max-width: 40rem; }
  .words .pre { font-size: clamp(18px, 2vw, 32px); font-weight: 900; color: var(--teal-dark); margin: 0 0 -1.5vh; }
  .words .big.sm { font-size: clamp(48px, 7.5vw, 128px); white-space: nowrap; }
  .words .src { font-size: clamp(12px, 1vw, 16px); font-weight: 700; color: #7A8585; }
  .words .big { font-size: clamp(64px, 11vw, 180px); line-height: 0.9; font-weight: 900; color: var(--teal); margin: 0; }
  .words > * { transition: opacity .35s ease, transform .35s ease; }
  .words.out > * { opacity: 0; transform: translateY(10px); }
  .phone-wrap { position: relative; height: min(88vh, 860px); aspect-ratio: 390 / 844; }
  .phone { position: absolute; inset: 0; border-radius: 13% / 6%; background: #111; padding: 3.2% ; box-shadow: 0 30px 60px rgba(20,40,40,.18); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 10.5% / 4.9%; overflow: hidden; background: #fff; }
  .screen iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; }
  .notch { position: absolute; top: 1.6%; left: 50%; transform: translateX(-50%); width: 30%; height: 3.4%; background: #111; border-radius: 999px; z-index: 3; pointer-events: none; }
  .ring { position: absolute; z-index: 4; pointer-events: none; border: 4px solid var(--orange); border-radius: 18px; opacity: 0; transition: opacity .3s; }
  .ring.on { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(249,115,22,.45); } 50% { box-shadow: 0 0 0 12px rgba(249,115,22,0); } }
  .tap { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%); background: var(--ink); color: #fff; font-size: 13px; font-weight: 900; padding: 5px 10px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .tap.on { opacity: 1; }
  /* presenter */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 4px; background: transparent; }
  .bar i { display: block; height: 100%; background: var(--teal); width: 0; transition: width .4s ease; }
  .notes { position: fixed; left: 2vw; right: 2vw; bottom: 2vh; background: #1F2424; color: #F1F4F4; border-radius: 16px; padding: 14px 18px; font-size: 17px; line-height: 1.45; font-weight: 700; display: none; z-index: 10; max-width: 60rem; }
  .notes.on { display: block; }
  .notes b { color: #8EE3D8; }
  .notes .meta { display: flex; gap: 16px; font-size: 13px; color: #A9B6B6; margin-bottom: 6px; }
  .timer { position: fixed; top: 2vh; right: 2vw; font-size: 15px; font-weight: 900; color: var(--muted); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; display: none; font-variant-numeric: tabular-nums; z-index: 10; }
  .timer.on { display: block; }
  .timer.over { color: #fff; background: #C0312B; border-color: #C0312B; }
  .help { position: fixed; top: 2vh; left: 2vw; font-size: 13px; font-weight: 800; color: var(--muted); background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; z-index: 10; display: none; line-height: 1.6; }
  .help.on { display: block; }
  .ploopy-fidget { display: flex; gap: 1vw; align-items: flex-end; }
  .ploopy-fidget button { background: none; border: 0; padding: 0; cursor: pointer; transition: transform .12s; }
  .ploopy-fidget button:active, .ploopy-fidget button.squish { animation: squish .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes squish { 0% { transform: scale(1,1); } 30% { transform: scale(1.18,.78); } 60% { transform: scale(.92,1.1); } 100% { transform: scale(1,1); } }
  @media (prefers-reduced-motion: reduce) { .ring.on, .ploopy-fidget button.squish { animation: none; } }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; justify-items: center; overflow: auto; } .phone-wrap { height: 70vh; } }
</style>
</head>
<body>
<div class="stage">
  <div class="words" id="words" aria-live="polite"></div>
  <div class="phone-wrap" id="phoneWrap">
    <div class="phone"><div class="screen" id="screen"><div class="notch"></div><iframe id="app" title="Plop app, live"></iframe></div></div>
    <div class="ring" id="ring"></div>
    <div class="tap" id="tap">tap</div>
  </div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="timer" id="timer">0:00</div>
<div class="help" id="help">→ / Space: next &nbsp; ←: back<br>N: notes &nbsp; T: timer &nbsp; R: reset app<br>Phone is the real app. Tap it any time.</div>
<div class="notes" id="notes"></div>

  // ---------- the live app inside the phone ----------
  var iframe = document.getElementById('app');
  var appWin = null;
  function bootApp(route) {
    var b64 = document.getElementById('app-b64').textContent.trim();
    var bytes = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
    var html = new TextDecoder().decode(bytes);
    var pre = '<script>try{localStorage.removeItem("plop-front-v2")}catch(e){}window.__PLOP_QS="?mode=cached";<\/script>';
    html = html.replace('<head>', '<head>' + pre).replace('new URLSearchParams(location.search)', 'new URLSearchParams(window.__PLOP_QS || location.search)');
    iframe.onload = function () { appWin = iframe.contentWindow; if (route) go(route); };
    iframe.srcdoc = html;
  }
  function doc() { try { return iframe.contentDocument; } catch (e) { return null; } }
  function go(route) { if (!appWin) return; if (appWin.location.hash !== '#' + route) appWin.location.hash = route; }
  function el(sel) { var d = doc(); return d ? d.querySelector(sel) : null; }
  function click(sel) { var e = el(sel); if (e) e.click(); return !!e; }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function until(sel, ms) { var t = 0; while (t < (ms || 4000)) { if (el(sel)) return el(sel); await wait(100); t += 100; } return null; }

  function fitPhone() {
    var s = document.getElementById('screen');
    iframe.style.transform = 'scale(' + (s.clientWidth / 390) + ')';
    iframe.style.height = (s.clientHeight / (s.clientWidth / 390)) + 'px';
  }
  window.addEventListener('resize', function () { fitPhone(); placeRing(); });

  // ---------- hotspot ----------
  var ringSel = null, ringLabel = '';
  function placeRing() {
    var ring = document.getElementById('ring'), tap = document.getElementById('tap');
    var e = ringSel && el(ringSel);
    if (!e) { ring.classList.remove('on'); tap.classList.remove('on'); return; }
    var wrap = document.getElementById('phoneWrap').getBoundingClientRect();
    var fr = iframe.getBoundingClientRect(), r = e.getBoundingClientRect();
    var k = fr.width / 390, pad = 6;
    var x = fr.left - wrap.left + r.left * k - pad, y = fr.top - wrap.top + r.top * k - pad;
    var w = r.width * k + pad * 2, h = r.height * k + pad * 2;
    var sr = document.getElementById('screen').getBoundingClientRect();
    if (y + h < sr.top - wrap.top || y > sr.bottom - wrap.top) { ring.classList.remove('on'); tap.classList.remove('on'); return; }
    Object.assign(ring.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    ring.classList.add('on');
    tap.textContent = ringLabel || 'tap';
    Object.assign(tap.style, { left: (x + w / 2) + 'px', top: (y - 16) + 'px' });
    tap.classList.add('on');
  }
  setInterval(placeRing, 400);
  function ringOn(sel, label) { ringSel = sel; ringLabel = label; placeRing(); }

  // ---------- the script (about 4 minutes) ----------
  var STEPS = [
    { secs: 20, route: 'home',
      html: '<p class="pre">More than</p><p class="big">1 in 4</p><h1>adults have a bowel disorder.</h1><p>Most of us would rather talk about anything else.</p><span class="src">More than 1 in 4 meet Rome IV criteria. Palsson et al., Gastroenterology, n = 5,931, US, Canada, UK. Online survey.</span>',
      notes: 'Open on the number, not the product. Say "more than one in four", never a decimal. Pause after the second line.' },
    { secs: 15, route: 'home',
      html: '<h1>“I plopped” should sound as normal as “I ran 5k”.</h1><p>That’s the whole mission.</p>',
      notes: 'Mission line. Hold eye contact. Optional hand-raise: "Who here has googled their poop?" Count the hands out loud.' },
    { secs: 20, route: 'home', ring: ['.chip-bar', 'streak + GP'],
      html: '<h1>Meet Plop.</h1><p>A gut diary built like a game. Streaks, daily quests, and Ploopy, who gets excited when you show up.</p>',
      notes: 'Point at the streak and the three quests. This is the real app running, not a video.' },
    { secs: 25, route: 'scan', ring: ['#shutter', 'tap to scan'],
      html: '<h1>Snap it.</h1><p>Gemini reads shape and colour. The photo is scored, then deleted. Nobody sees it.</p><span class="src">Stage demo uses Play-Doh. Cached run, so the venue wifi can’t hurt us.</span>',
      notes: 'Tap the shutter yourself, or press Space and it fires. Say "Play-Doh" out loud before anyone asks. We do not store photos. Google’s retention terms for our Gemini tier are still unchecked: say "we don’t store it", not "nobody ever has it".',
      action: async function () { if (!el('#shutter')) { go('scan'); await until('#shutter'); } click('#shutter'); await until('.score-card', 5000); } },
    { secs: 30, route: null, ring: ['.score-card', 'your private result'],
      html: '<h1>You see the result. Only you.</h1><p>It never says “no blood”. It says “possible blood” or “can’t tell from a photo”, and it is not a diagnosis.</p>',
      notes: 'Scroll down on the phone to the blood row and the chips. Script: "We log, we never diagnose. The possible-blood flag only prompts a doctor visit." Then tap Check in.',
      action: async function () { if (!click('[data-act="checkin"]')) { go('home'); return; } await until('[data-act="continue"],[data-act="share"]', 4000); } },
    { secs: 20, route: null, ring: ['[data-act="continue"]', 'continue'],
      html: '<h1>Checked in.</h1><p>GP, streak, and two small habits for tomorrow. Five seconds and you’re back to your day.</p>',
      notes: 'Let the GP count-up play. Do not explain the formula unless asked.' },
    { secs: 20, route: 'ranked', ring: ['a[href="#tiers"]', 'friends ladder'],
      html: '<h1>Your friends make it a habit.</h1><p>Weekly ranks with the people you actually know, plus an opt-in global board with made-up names.</p>',
      notes: 'Scroll to the friends ladder. If asked whether a rough day costs points: answer straight, it does in this build, and the team can say whether that stays.' },
    { secs: 25, route: 'buddies', ring: ['[data-act="invite"]', 'invite a buddy'],
      html: '<h1>Buddies see that you showed up.</h1><p>Never your photo, your type or your colour.</p>',
      notes: 'The hardest question is "is my poop on my friend’s phone?" The answer is no. Show what buddies see.' },
    { secs: 30, route: 'record', ring: ['[data-act="pdf"]', 'doctor summary'],
      html: '<h1>Thirty days, one page.</h1><p>When you finally see a doctor, you bring a dated record instead of “uh, sometimes?”.</p>',
      notes: 'This is the useful part. Scroll the calendar. Tap the summary. We log, we never diagnose.' },
    { secs: 15, route: 'record',
      html: '<p class="big sm">6.1% vs 3.2%</p><h1>IBS in women vs men.</h1><p>So cycle tracking is opt-in and built in. No pink version.</p><span class="src">Rome IV, Palsson et al., Gastroenterology. Cut this slide first if you run long.</span>',
      notes: 'Say "almost twice as common". Do not say "times more likely" about the endometriosis odds ratio if it comes up.' },
    { secs: 15, route: 'home',
      html: '<h1>What we didn’t do.</h1><p>No real stool on stage. No diagnosis. Desk research from public sources. Demo buddies are seeded.</p>',
      notes: 'Say all four out loud. Judges trust you more after this. Never claim "first".' },
    { secs: 5, route: 'home', fidget: true,
      html: '<h1>Plop. Log it, and get on with your day.</h1><div class="ploopy-fidget" id="fidget"></div><p>Go on, squish one.</p>',
      notes: 'End on Ploopy. Tap one so it squishes. Thank the judges in one breath, then stop talking.' }
  ];

  // ---------- presenter ----------
  var i = -1, busy = false, started = null;
  async function show(n, runAction) {
    if (busy || n < 0 || n >= STEPS.length) return;
    busy = true;
    var prev = STEPS[i];
    if (runAction && prev && prev.action && n === i + 1) { try { await prev.action(); } catch (e) {} }
    i = n;
    var s = STEPS[i];
    var w = document.getElementById('words');
    w.classList.add('out'); await wait(200);
    w.innerHTML = s.html; w.classList.remove('out');
    if (s.route) go(s.route);
    if (s.fidget) buildFidget();
    ringSel = null; placeRing();
    setTimeout(function () { if (s.ring) ringOn(s.ring[0], s.ring[1]); }, 450);
    document.getElementById('bar').style.width = ((i + 1) / STEPS.length * 100) + '%';
    var t = STEPS.slice(0, i).reduce(function (a, b) { return a + b.secs; }, 0);
    document.getElementById('notes').innerHTML = '<div class="meta"><span>' + (i + 1) + ' of ' + STEPS.length + '</span><span>~' + s.secs + 's</span><span>should be at ' + fmt(t) + '</span></div>' + s.notes;
    if (!started && i > 0) started = Date.now();
    busy = false;
  }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  setInterval(function () {
    var el = document.getElementById('timer'), sec = started ? (Date.now() - started) / 1000 : 0;
    el.textContent = fmt(sec) + ' / 4:00'; el.classList.toggle('over', sec > 240);
  }, 500);

  function buildFidget() {
    var box = document.getElementById('fidget'); if (!box) return;
    var names = Object.keys(PLOOPY);
    if (!names.length) { box.remove(); return; }
    box.innerHTML = names.map(function (k) {
      return '<button aria-label="Squish the ' + k + ' Ploopy" data-k="' + k + '"><img alt="" src="' + PLOOPY[k].hello + '" style="height:clamp(48px,6vw,100px)"></button>';
    }).join('');
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var p = PLOOPY[b.dataset.k], img = b.querySelector('img');
      b.classList.remove('squish'); void b.offsetWidth; b.classList.add('squish');
      img.src = p.cheer; setTimeout(function () { img.src = p.hello; }, 700);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); show(i + 1, true); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); show(i - 1, false); }
    else if (k === 'n' || k === 'N') document.getElementById('notes').classList.toggle('on');
    else if (k === 't' || k === 'T') document.getElementById('timer').classList.toggle('on');
    else if (k === 'r' || k === 'R') { bootApp(STEPS[Math.max(i, 0)].route || 'home'); }
    else if (k === '?' || k === 'h' || k === 'H') document.getElementById('help').classList.toggle('on');
  });
  // keys keep working after someone taps the phone
  iframe.addEventListener('load', function () {
    try { iframe.contentDocument.addEventListener('keydown', function (e) {
      if (['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'n', 'N', 't', 'T', 'r', 'R', '?', 'h', 'H'].indexOf(e.key) >= 0) {
        e.preventDefault(); document.dispatchEvent(new KeyboardEvent('keydown', { key: e.key }));
      }
    }); } catch (err) {}
  });

  bootApp('home');
  fitPhone(); setTimeout(fitPhone, 300);
  show(0);
  document.getElementById('help').classList.add('on');
  setTimeout(function () { document.getElementById('help').classList.remove('on'); }, 5000);
  window.__pitch = { show: function (n) { return show(n, true); }, next: function () { return show(i + 1, true); }, get i() { return i; } };
})();
</script>
</body>
</html>
