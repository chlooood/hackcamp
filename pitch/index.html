<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plop pitch</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --teal:#0D9488; --teal-dark:#0B6E64; --ink:#1F2424; --muted:#5F6B6B; --bg:#F4F6F6; --line:#E3E8E8; --orange:#F97316; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  .stage { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4vw; padding: 15vh 6vw 4vh; }
  .words { display: flex; flex-direction: column; gap: 2.4vh; max-width: 54rem; }
  .words h1 { font-size: clamp(34px, 5.2vw, 88px); line-height: 1.04; font-weight: 900; margin: 0; letter-spacing: -0.01em; }
  .words p { font-size: clamp(18px, 2vw, 32px); line-height: 1.35; font-weight: 700; color: var(--muted); margin: 0; max-width: 40rem; }
  .words .pre { font-size: clamp(18px, 2vw, 32px); font-weight: 900; color: var(--teal-dark); margin: 0 0 -1.5vh; }
  .words .big.sm { font-size: clamp(48px, 7.5vw, 128px); white-space: nowrap; }
  .words .src { font-size: clamp(12px, 1vw, 16px); font-weight: 700; color: #7A8585; }
  .words .big { font-size: clamp(64px, 11vw, 180px); line-height: 0.9; font-weight: 900; color: var(--teal); margin: 0; }
  .words > * { transition: opacity .35s ease, transform .35s ease; }
  .words.out > * { opacity: 0; transform: translateY(10px); }
  .phone-wrap { position: relative; align-self: center; height: min(80vh, 820px); aspect-ratio: 390 / 844; }
  .phone { position: absolute; inset: 0; border-radius: 13% / 6%; background: #111; padding: 3.2% ; box-shadow: 0 30px 60px rgba(20,40,40,.18); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 10.5% / 4.9%; overflow: hidden; background: #fff; }
  .screen iframe { position: absolute; left: 0; top: 0; width: 390px; height: 844px; border: 0; transform-origin: 0 0; }
  .notch { position: absolute; top: 1.6%; left: 50%; transform: translateX(-50%); width: 30%; height: 3.4%; background: #111; border-radius: 999px; z-index: 3; pointer-events: none; }
  .ring { position: absolute; z-index: 4; pointer-events: none; border: 4px solid var(--orange); border-radius: 18px; opacity: 0; transition: opacity .3s; }
  .ring.on { opacity: 1; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(249,115,22,.45); } 50% { box-shadow: 0 0 0 12px rgba(249,115,22,0); } }
  .tap { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -50%); background: var(--ink); color: #fff; font-size: 13px; font-weight: 900; padding: 5px 10px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .3s; }
  .tap.on { opacity: 1; }
  /* presenter */
  /* ---------- quest world ---------- */
  .world { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .world .dots { position: absolute; inset: 0; background-image: radial-gradient(#C7D3D3 1.6px, transparent 1.7px); background-size: 34px 34px; opacity: .7; }
  .shape { position: absolute; opacity: .8; }
  .s-circle { width: 26vh; height: 26vh; border-radius: 50%; border: 22px solid #CCF5EF; }
  .s-square { width: 16vh; height: 16vh; border-radius: 28px; background: #E8E7FF; }
  .s-tri { width: 0; height: 0; border-left: 9vh solid transparent; border-right: 9vh solid transparent; border-bottom: 15vh solid #FFEDD5; }
  .s-half { width: 22vh; height: 11vh; border-radius: 22vh 22vh 0 0; background: #FFF3C4; }
  .s-pill { width: 30vh; height: 7vh; border-radius: 999px; background: #D5F5F0; }
  .s-ring { width: 10vh; height: 10vh; border-radius: 50%; border: 10px solid #FFD9C2; }
  .s-plus { width: 8vh; height: 8vh; background: linear-gradient(#E0DEFF,#E0DEFF) center/30% 100% no-repeat, linear-gradient(#E0DEFF,#E0DEFF) center/100% 30% no-repeat; }
  /* level wipe */
  .wipe { position: fixed; left: 0; top: 0; bottom: 0; width: 60vw; z-index: 20; border-radius: 0 28px 28px 0; overflow: hidden; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(6, 1fr); pointer-events: none; }
  .wipe i { background: var(--teal); transform: scale(0); border-radius: 22%; transition: transform .22s cubic-bezier(.5,0,.3,1.2), border-radius .22s; }
  .wipe i:nth-child(3n) { background: var(--teal-dark); }
  .wipe i:nth-child(7n) { background: #14A396; }
  .wipe.cover i { transform: scale(1.04); border-radius: 0; }
  .banner { position: fixed; z-index: 21; left: 30vw; top: 50%; transform: translate(-50%,-50%) scale(.6); opacity: 0; pointer-events: none; text-align: center; color: #fff; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .15s; display: flex; flex-direction: column; align-items: center; gap: 1vh; }
  .banner.on { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  .banner .ch { font-size: clamp(16px, 1.8vw, 28px); font-weight: 900; letter-spacing: .04em; color: #CCF5EF; }
  .banner .ti { font-size: clamp(44px, 6.4vw, 110px); font-weight: 900; line-height: 1; }
  .banner .pl { width: clamp(90px, 9vw, 150px); }
  /* in-chapter: game-y slide */
  .words.enter > * { animation: hop .55s cubic-bezier(.3,1.5,.5,1) both; }
  .words.enter > *:nth-child(2) { animation-delay: .06s; } .words.enter > *:nth-child(3) { animation-delay: .12s; } .words.enter > *:nth-child(4) { animation-delay: .18s; } .words.enter > *:nth-child(5) { animation-delay: .24s; }
  @keyframes hop { 0% { opacity: 0; transform: translateX(60px) scale(.96); } 100% { opacity: 1; transform: none; } }
  .words.leave > * { transition: opacity .18s, transform .18s; opacity: 0; transform: translateX(-50px); }
  /* quest map HUD */
  .hud { position: fixed; z-index: 5; left: 6vw; top: 5vh; width: min(560px, 50vw); height: 64px; }
  .hud .qt { position: absolute; left: calc(100% + 18px); top: 13px; font-size: 13px; font-weight: 900; color: var(--teal-dark); white-space: nowrap; }
  .hud .path { position: absolute; left: 18px; right: 18px; top: 22px; border-top: 4px dotted #B9C6C6; }
  .hud .done { position: absolute; left: 18px; top: 20px; height: 8px; border-radius: 99px; background: var(--teal); width: 0; transition: width 1s cubic-bezier(.5,0,.2,1); }
  .node { position: absolute; top: 4px; width: 40px; height: 40px; margin-left: -20px; display: grid; place-items: center; }
  .node b { width: 30px; height: 30px; background: #fff; border: 4px solid #B9C6C6; transition: background .3s, border-color .3s, transform .3s; display: grid; place-items: center; color: #fff; font-size: 14px; }
  .node.circle b { border-radius: 50%; } .node.square b { border-radius: 8px; } .node.diamond b { border-radius: 6px; transform: rotate(45deg); } .node.diamond b span { transform: rotate(-45deg); } .node.hex b { border-radius: 30%; } .node.flag b { border-radius: 50% 50% 50% 8px; }
  .node.cleared b { background: var(--teal); border-color: var(--teal); }
  .node.here b { border-color: var(--orange); background: #FFEDD5; }
  .node em { position: absolute; top: 44px; white-space: nowrap; font-style: normal; font-size: 12px; font-weight: 900; color: var(--muted); }
  .node.here em { color: var(--ink); }
  .hero { position: absolute; top: -34px; width: 46px; margin-left: -23px; transition: left 1s cubic-bezier(.5,0,.2,1); z-index: 2; }
  .hero.hopping { animation: hopping 1s ease-in-out; }
  @keyframes hopping { 0%,100% { transform: translateY(0); } 25%,75% { transform: translateY(-14px) rotate(-6deg); } 50% { transform: translateY(0) scale(1.1,.9); } }
  /* quest complete */
  .confetti { position: fixed; left: 0; top: 0; bottom: 0; width: 60vw; z-index: 4; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -40px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
  @media (prefers-reduced-motion: reduce) { .shape, .hero.hopping, .words.enter > *, .confetti i { animation: none !important; } .world, .hud .done, .hero { transition: none; } }
  .notes { position: fixed; left: 2vw; right: 2vw; bottom: 2vh; background: #1F2424; color: #F1F4F4; border-radius: 16px; padding: 14px 18px; font-size: 17px; line-height: 1.45; font-weight: 700; display: none; z-index: 10; max-width: 60rem; }
  .notes.on { display: block; }
  .notes b { color: #8EE3D8; }
  .notes .meta { display: flex; gap: 16px; font-size: 13px; color: #A9B6B6; margin-bottom: 6px; }
  .timer { position: fixed; top: 2vh; right: 2vw; font-size: 15px; font-weight: 900; color: var(--muted); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; display: none; font-variant-numeric: tabular-nums; z-index: 10; }
  .timer.on { display: block; }
  .timer.over { color: #fff; background: #C0312B; border-color: #C0312B; }
  .help { position: fixed; bottom: 2vh; left: 2vw; font-size: 13px; font-weight: 800; color: var(--muted); background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; z-index: 10; display: none; line-height: 1.6; }
  .help.on { display: block; }
  .ploopy-fidget { display: flex; gap: 1vw; align-items: flex-end; }
  .ploopy-fidget button { background: none; border: 0; padding: 0; cursor: pointer; transition: transform .12s; }
  .ploopy-fidget button:active, .ploopy-fidget button.squish { animation: squish .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes squish { 0% { transform: scale(1,1); } 30% { transform: scale(1.18,.78); } 60% { transform: scale(.92,1.1); } 100% { transform: scale(1,1); } }
  .pl { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .spark { position: absolute; width: clamp(28px, 3vw, 52px) !important; height: auto; }
  .go .pop { animation: popin .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes popin { 0% { transform: scale(.4) translateY(20px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .go .bob { animation: popin .6s cubic-bezier(.3,1.6,.5,1) both, bob 2.4s ease-in-out .8s infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-3deg); } }
  .crowd { display: flex; align-items: flex-end; gap: 1.6vw; margin: 1vh 0 0; }
  .crowd .who { position: relative; }
  .crowd .pl { width: clamp(80px, 9vw, 160px); }
  .crowd .who.dim .pl { opacity: .55; filter: saturate(.4); }
  .crowd .who.me .pl { width: clamp(100px, 11vw, 200px); }
  .card { background: #fff; border-radius: 28px; padding: clamp(18px, 2.4vw, 36px); box-shadow: 0 10px 30px rgba(20,60,60,.07); }
  .night { background: #141C30; color: #fff; border-radius: 28px; padding: clamp(18px, 2.4vw, 36px); position: relative; }
  .night .t { color: #fff; }
  .rider { position: absolute; top: 50%; transform: translate(-50%, -58%); width: clamp(46px, 4.4vw, 76px); transition: left 1s cubic-bezier(.2,.8,.2,1); left: 0; }
  .go .rider { left: var(--w); }
  .track { position: relative; overflow: visible !important; }
  .track .fill { overflow: hidden; }
  .vbar .pl { width: 82%; margin-bottom: -10px; position: relative; z-index: 1; }
  .phone-wrap { transition: opacity .3s; }
  body.nophone.intro-done .phone-wrap { opacity: 1; transition: opacity .8s; }
  .opener { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 3vw; }
  .opener svg.bodyart { height: 76vh; filter: drop-shadow(0 18px 30px rgba(20,60,60,.10)); width: auto; overflow: visible; }
  .opener .tail { display: flex; flex-direction: column; gap: 1.6vh; opacity: 0; transform: translateY(16px); transition: opacity .5s, transform .5s cubic-bezier(.3,1.5,.5,1); }
  .opener.done .tail { opacity: 1; transform: none; }
  .opener .tail h1 { font-size: clamp(28px, 3vw, 54px); white-space: nowrap; }
  .opener .mark { font-size: clamp(72px, 11vw, 190px); font-weight: 900; color: var(--teal); line-height: .9; margin: 0; letter-spacing: -0.02em; }
  .bodyart .food { transition: transform .15s; transform-origin: 128px 150px; }
  .bodyart .bite { opacity: 0; } .bodyart.b1 .bite.a, .bodyart.b2 .bite.b, .bodyart.b2 .bite.a { opacity: 1; }
  .bodyart.gone .food { transform: scale(0); transition: transform .2s; }
  .bodyart .trail { fill: none; stroke: #0D9488; stroke-width: 5; stroke-dasharray: none; opacity: .9; stroke-linecap: round; stroke-linejoin: round; }
  .bodyart .mouth { transform-origin: 189px 151px; transition: transform .12s; }
  .bodyart.chew .mouth { transform: scale(1.3, 2.2); }
  .bodyart .stomach { transform-origin: 290px 356px; transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
  .bodyart.squish .stomach { transform: scale(1.12, .9); }
  .bodyart .out { transform-origin: 256px 660px; transform: scale(0); transition: transform .5s cubic-bezier(.3,1.7,.5,1); }
  .bodyart.born .out { transform: scale(1); }
  .bodyart .tag { font-family: Nunito; font-weight: 900; font-size: 20px; fill: #5F6B6B; opacity: 0; transition: opacity .3s; }
  .bodyart .tag.on { opacity: 1; }
  body.nophone .words { gap: 1.8vh; }
  body.nophone .words h1 { font-size: clamp(30px, 3.6vw, 60px); }
  body.nophone .words .big { font-size: clamp(56px, 8.5vw, 150px); }
  .words { max-height: 81vh; }
  body.nophone .phone-wrap { opacity: .35; }
  .chart { display: flex; flex-direction: column; gap: 2.2vh; width: 100%; max-width: 64rem; margin-top: 1vh; }
  .hbar { display: grid; grid-template-columns: clamp(80px, 9vw, 150px) minmax(0, 1fr); align-items: center; gap: 1.6vw; }
  .hbar .n { font-size: clamp(36px, 4.6vw, 80px); font-weight: 900; color: var(--teal); line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .hbar .lab { font-size: clamp(16px, 1.6vw, 26px); font-weight: 800; line-height: 1.25; margin-bottom: 14px; }
  .chart.card { gap: 3.4vh; }
  .track { height: clamp(20px, 2.6vh, 30px); background: #D5F5F0; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .fill.alt { background: var(--orange); }
  .go .fill { width: var(--w); }
  .vbars { display: flex; align-items: flex-end; gap: 3vw; height: 38vh; }
  .vbars.card { padding-bottom: clamp(14px, 2vh, 24px); }
  .vbar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; height: 100%; width: clamp(90px, 9vw, 160px); }
  .vbar .col { width: 100%; height: 0; background: var(--teal); border-radius: 18px 18px 6px 6px; transition: height 1s cubic-bezier(.2,.8,.2,1); }
  .vbar .col.x { }
  .vbars .vbar .col { background: #8C93D9; flex-shrink: 0; }
  .vbars .vbar.m .col { background: #8FA77A; }
  .go .vbar .col { height: var(--h); }
  .vbar .n { font-size: clamp(30px, 3.6vw, 64px); font-weight: 900; line-height: 1; }
  .vbar .lab { font-size: clamp(15px, 1.4vw, 22px); font-weight: 800; color: var(--muted); }
  .split { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5vw; align-items: end; width: 100%; }
  .forest { display: flex; flex-direction: column; gap: 14px; }
  .forest svg:not(.spark) { width: 100%; height: auto; overflow: visible; }
  .forest .t { font-size: clamp(16px, 1.5vw, 24px); font-weight: 800; line-height: 1.3; }
  .timeline { width: 100%; max-width: 70rem; }
  .timeline svg { width: 100%; height: auto; overflow: visible; }
  .tag { display: inline-block; font-size: 0.8em; font-weight: 900; background: #FFEDD5; color: #7A3A00; border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
  @media (prefers-reduced-motion: reduce) { .fill, .vbar .col { transition: none; } }
  @media (prefers-reduced-motion: reduce) { .ring.on, .ploopy-fidget button.squish { animation: none; } }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; justify-items: center; overflow: auto; } .phone-wrap { height: 70vh; } }
</style>
</head>
<body>
<div class="stage" id="stageEl">
  <div class="words" id="words" aria-live="polite"></div>
  <div class="phone-wrap" id="phoneWrap">
    <div class="phone"><div class="screen" id="screen"><div class="notch"></div><iframe id="app" title="Plop app, live"></iframe></div></div>
    <div class="ring" id="ring"></div>
    <div class="tap" id="tap">tap</div>
  </div>
</div>
<div class="world" id="world" aria-hidden="true"><div class="dots"></div>
  <div class="shape s-circle" style="left:-9vh;bottom:-9vh;top:auto"></div>
  <div class="shape s-half" style="left:42%;bottom:-1px;top:auto"></div>
  <div class="shape s-square" style="right:-5vh;bottom:-5vh;left:auto;top:auto;transform:rotate(14deg)"></div>
  <div class="shape s-pill" style="left:52%;top:-3.5vh"></div>
  <div class="shape s-tri" style="right:31vw;top:44%;left:auto;transform:rotate(-12deg)"></div>
</div>
<div class="hud" id="hud" aria-label="Quest progress"></div>
<div class="wipe" id="wipe" aria-hidden="true"></div>
<div class="banner" id="banner" aria-live="polite"></div>
<div class="confetti" id="confetti" aria-hidden="true"></div>
<div class="timer" id="timer">0:00</div>

    { secs: 20, route: 'home', phone: false,
      html: '<p class="pre">More than</p><p class="big">1 in 4</p><h1>adults have a bowel disorder.</h1>' +

    { secs: 20, route: 'home', phone: false,
      html: '<h1>And we really don’t want to talk about it.</h1>' +
        '<div class="chart card">' +

        '</div>' +
        '<span class="src"><span class="tag">Secondary</span>71% and 35%: Oshi Health / Harris Poll, 2026 (vendor survey). 25%: BUPA survey, n = 1,245. Surveys show association, not cause.</span>',
      notes: 'Read the top number, let the bars land. Optional hand-raise here: "Who has googled their poop instead of asking someone?" Count the hands out loud. If asked: these are surveys, two from companies, and embarrassment is one barrier among several. Re-open the links in research.md before saying them on stage.' },
    { secs: 10, route: 'home',
      html: '<h1>“I plopped” should sound as normal as “I ran 5k”.</h1><p>That’s the whole mission.</p>',

    { secs: 20, route: 'home', ring: ['.chip-bar', 'streak + Deuces'],
      html: '<h1>Meet Plop.</h1><p>A gut diary built like a game. Streaks, daily quests, and Ploopy, who gets excited when you show up.</p>',
      notes: 'Point at the streak and the three quests. This is the real app running, not a video.' },
    { secs: 25, route: 'scan', ring: ['#shutter', 'tap to scan'],
      html: '<h1>Snap it.</h1><p>Gemini reads shape and colour. The photo is scored, then deleted. Nobody sees it.</p><span class="src">Stage demo uses Play-Doh. Cached run, so the venue wifi can’t hurt us.</span>',
      notes: 'Tap the shutter yourself, or press Space and it fires. Say "Play-Doh" out loud before anyone asks. We do not store photos. Google’s retention terms for our Gemini tier are still unchecked: say "we don’t store it", not "nobody ever has it".',
      action: async function () { if (!el('#shutter')) { go('scan'); await until('#shutter'); } click('#shutter'); await until('.score-card', 5000); } },
    { secs: 25, route: null, ring: ['.score-card', 'your private result'],
      html: '<h1>You see the result. Only you.</h1><p>It never says “no blood”. It says “possible blood” or “can’t tell from a photo”, and it is not a diagnosis.</p>',
      notes: 'Scroll down on the phone to the blood row and the chips. Script: "We log, we never diagnose. The possible-blood flag only prompts a doctor visit." Then tap Check in.',
      action: async function () { if (!click('[data-act="checkin"]')) { go('home'); return; } await until('[data-act="continue"],[data-act="share"]', 4000); } },
    { secs: 15, route: null, ring: ['[data-act="continue"]', 'continue'],
      html: '<h1>Checked in.</h1><p>Deuces, streak, and two small habits for tomorrow. Five seconds and you’re back to your day.</p>',

    { secs: 20, route: 'ranked', ring: ['a[href="#tiers"]', 'friends ladder'],

    { secs: 20, route: 'buddies', ring: ['[data-act="invite"]', 'invite a buddy'],

      notes: 'The hardest question is "is my poop on my friend’s phone?" The answer is no. Show what buddies see.' },
    { secs: 15, route: 'record', phone: false,
      html: '<h1>When you finally go, you’re working from memory.</h1>' +
        '<div class="timeline card" style="position:relative;padding-top:clamp(28px,4vh,48px)"><svg viewBox="0 0 1000 230" role="img" aria-label="Timeline: first symptom, then over two months of putting it off, then the appointment">' +
          '<path d="M90 120 C 150 40, 210 200, 270 120 S 390 40, 450 120 S 570 200, 630 120 S 750 40, 810 120" fill="none" stroke="#F97316" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 24"/>' +
          '<line x1="810" y1="120" x2="900" y2="120" stroke="#0D9488" stroke-width="12" stroke-linecap="round"/>' +

        '</svg>' +
          '<div class="pop" style="position:absolute;left:3%;top:34%;width:10%;animation-delay:.1s">' + pl('caramel', 'oh') + '</div>' +

        '<p>1 in 4 put it off out of embarrassment, and the average delay is over two months.</p>' +
        '<span class="src"><span class="tag">Secondary</span>BUPA survey, n = 1,245. Self-reported. Not a diagnosis statistic.</span>',
      notes: 'Set up the record. "Then the doctor asks how often and since when, and you guess." Do not mention cancer unless asked. If asked, we are a diary, not a detector.' },
    { secs: 25, route: 'record', ring: ['[data-act="pdf"]', 'doctor summary'],
      html: '<h1>Thirty days, one page.</h1><p>When you finally see a doctor, you bring a dated record instead of “uh, sometimes?”.</p>',
      notes: 'This is the useful part. Scroll the calendar. Tap the summary. We log, we never diagnose.' },
    { secs: 20, route: 'record', phone: false,
      html: '<h1>Gut trouble isn’t evenly shared.</h1>' +
        '<div class="split">' +
          '<div class="vbars card" role="img" aria-label="IBS prevalence: women 6.1 percent, men 3.2 percent" style="height:auto;align-items:flex-end">' +
            '<div class="vbar"><span class="n">6.1%</span>' + pl('blueberry', 'oh', 'pop', 'animation-delay:.9s') + '<div class="col" style="--h:' + (6.1 / 6.1 * 22) + 'vh"></div><span class="lab">Women</span></div>' +
            '<div class="vbar m"><span class="n">3.2%</span>' + pl('sage', 'comfy', 'pop', 'animation-delay:.9s') + '<div class="col" style="--h:' + (3.2 / 6.1 * 22) + 'vh"></div><span class="lab">Men</span></div>' +
          '</div>' +

            '<span class="t">With endometriosis, the odds of IBS are about 3× higher.</span>' +

              '<line x1="0" y1="66" x2="600" y2="66" stroke="#34405E" stroke-width="2"/>' +

              '<text x="100" y="16" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="18" fill="#C9D4EC">no difference</text>' +
              '<line x1="' + (100 + (1.97 - 1) * 100) + '" y1="66" x2="' + (100 + (5.39 - 1) * 100) + '" y2="66" stroke="#F2B705" stroke-width="12" stroke-linecap="round"/>' +
              '<circle cx="' + (100 + (3.26 - 1) * 100) + '" cy="66" r="18" fill="#FFC800" stroke="#141C30" stroke-width="5"/>' +
              '<text x="' + (100 + (3.26 - 1) * 100) + '" y="124" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="22" fill="#FFFFFF">OR 3.26 (1.97 to 5.39)</text>' +
            '</svg></div>' +
        '</div>' +
        '<p>So cycle tracking is opt-in and built in. No pink version.</p>' +
        '<span class="src">IBS, Rome IV: Palsson et al., Gastroenterology, n = 5,931. Endometriosis: meta-analysis, PubMed 32949284. Cut this slide first if you run long.</span>',
      notes: 'Say "almost twice as common". For endometriosis say "odds", never "times more likely". If someone quotes 12% vs 8.6%: that is a second-hand Healthline number, we use the primary paper.' },
    { secs: 5, route: 'home', fidget: true,
      html: '<h1>Plop. Log it, and get on with your day.</h1><div class="ploopy-fidget" id="fidget"></div><p>Go on, squish one.</p>',
      notes: 'End on Ploopy. Tap one so it squishes. Thank the judges in one breath, then stop talking.' }
  ];

  // ---------- the quest ----------
  var CHAPTERS = [
    { from: 0, title: 'The problem', shape: 'circle', pl: ['caramel', 'oh'] },
    { from: 4, title: 'The app', shape: 'square', pl: ['caramel', 'yay'] },
    { from: 10, title: 'The record', shape: 'diamond', pl: ['caramel', 'focused'] },
    { from: 12, title: 'Real talk', shape: 'hex', pl: ['caramel', 'curious'] }
  ];
  var GOAL = { title: 'Quest complete', pl: ['caramel', 'cheer'] };
  function chapterOf(n) { var c = 0; CHAPTERS.forEach(function (ch, k) { if (n >= ch.from) c = k; }); return c; }
  function motionOK() { return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  var LAST = STEPS.length - 1, NODES = CHAPTERS.length + 1; // 4 chapters + the goal flag
  function nodeX(k) { return 'calc(18px + (100% - 36px) * ' + (k / (NODES - 1)) + ')'; }
  (function buildQuest() {
    var hud = document.getElementById('hud'), html = '<span class="qt">Quest: make “I plopped” normal</span><div class="path"></div><div class="done" id="done"></div>';
    CHAPTERS.forEach(function (ch, k) {
      html += '<div class="node ' + ch.shape + '" id="node' + k + '" style="left:' + nodeX(k) + '"><b><span></span></b><em>' + (k + 1) + '. ' + ch.title + '</em></div>';
    });
    html += '<div class="node flag" id="node' + CHAPTERS.length + '" style="left:' + nodeX(CHAPTERS.length) + '"><b><span>⚑</span></b><em>Goal</em></div>';
    html += '<div class="hero" id="hero" style="left:' + nodeX(0) + '">' + pl('caramel', 'hello') + '</div>';
    hud.innerHTML = html;
    var wipe = document.getElementById('wipe'); wipe.innerHTML = new Array(61).join('<i></i>');
    Array.prototype.forEach.call(wipe.children, function (t, k) { var c = k % 10, r = Math.floor(k / 10); t.style.transitionDelay = ((c + r) * 9) + 'ms'; });
  })();
  // Ploopy stands on the chapter you're in. A chapter gets its check when you leave it. The last step reaches the flag.
  function updateQuest(n) {
    var at = n === LAST ? CHAPTERS.length : chapterOf(n);
    for (var k = 0; k < NODES; k++) {
      var node = document.getElementById('node' + k), cleared = k < at || (n === LAST && k === at);
      node.classList.toggle('cleared', cleared);
      node.classList.toggle('here', k === at && !cleared);
      if (k < CHAPTERS.length) node.querySelector('span').textContent = cleared ? '✓' : '';
    }
    var hero = document.getElementById('hero'), pos = nodeX(at);
    if (hero.style.left !== pos) { hero.style.left = pos; if (motionOK()) { hero.classList.remove('hopping'); void hero.offsetWidth; hero.classList.add('hopping'); } }
    document.getElementById('done').style.width = 'calc((100% - 36px) * ' + (at / (NODES - 1)) + ')';
  }
  async function levelWipe(c) {
    var wipe = document.getElementById('wipe'), banner = document.getElementById('banner'), ch = c < CHAPTERS.length ? CHAPTERS[c] : GOAL;
    banner.innerHTML = pl(ch.pl[0], ch.pl[1]) + '<span class="ch">' + (c < CHAPTERS.length ? 'Chapter ' + (c + 1) + ' of ' + CHAPTERS.length : 'You made it') + '</span><span class="ti">' + ch.title + '</span>';
    wipe.classList.add('cover'); await wait(300);
    banner.classList.add('on'); await wait(450);
    banner.classList.remove('on');
  }
  function sizeLeft() {
    var r = document.getElementById('phoneWrap').getBoundingClientRect(), wv = Math.max(320, r.left - 20);
    ['wipe', 'confetti'].forEach(function (id) { document.getElementById(id).style.width = wv + 'px'; });
    document.getElementById('banner').style.left = (wv / 2) + 'px';
  }
  window.addEventListener('resize', sizeLeft); setTimeout(sizeLeft, 300);
  function levelUnwipe() { document.getElementById('wipe').classList.remove('cover'); }
  function confetti() {
    var box = document.getElementById('confetti'), cols = ['#0D9488', '#F97316', '#F2B705', '#8C93D9', '#8FA77A', '#14A396'], h = '';
    for (var k = 0; k < 70; k++) {
      var sz = 10 + Math.random() * 18, shape = k % 3 === 0 ? 'border-radius:50%' : (k % 3 === 1 ? 'border-radius:4px' : 'clip-path:polygon(50% 0,100% 100%,0 100%)');
      h += '<i style="left:' + (Math.random() * 100) + '%;width:' + sz + 'px;height:' + sz + 'px;background:' + cols[k % cols.length] + ';' + shape + ';animation-duration:' + (2.2 + Math.random() * 2) + 's;animation-delay:' + (Math.random() * .6) + 's"></i>';
    }
    box.innerHTML = h; setTimeout(function () { box.innerHTML = ''; }, 5200);
  }

  // ---------- presenter ----------
  var i = -1, busy = false, started = null;
  async function show(n, runAction) {
    if (busy || n < 0 || n >= STEPS.length) return;
    busy = true;
    var prev = STEPS[i];
    if (runAction && prev && prev.action && n === i + 1) { try { await prev.action(); } catch (e) {} }
    i = n;
    var s = STEPS[i];
    var w = document.getElementById('words');
    var from = STEPS.indexOf(prev), stage = function (k) { return k === LAST ? CHAPTERS.length : chapterOf(k); };
    var newCh = prev && n > from && stage(n) !== stage(from);
    if (newCh && motionOK()) { await levelWipe(stage(n)); }
    else { w.classList.remove('enter'); w.classList.add('leave'); await wait(motionOK() ? 180 : 0); }
    w.classList.remove('leave', 'enter'); void w.offsetWidth;
    w.innerHTML = s.html; if (motionOK()) w.classList.add('enter');
    updateQuest(n);
    if (newCh) setTimeout(levelUnwipe, 60);
    if (n === STEPS.length - 1 && motionOK()) setTimeout(confetti, 300);
    document.body.classList.toggle('nophone', s.phone === false);
    fitPhone(); setTimeout(fitPhone, 60);
    setTimeout(function () { var c = w.querySelectorAll('.chart,.vbars,.timeline'); c.forEach(function (x) { x.classList.add('go'); }); }, 120);
    if (s.route) go(s.route);
    if (s.fidget) buildFidget();
    document.body.classList.remove('intro-done');
    if (s.intro) playOpener();
    ringSel = null; placeRing(); if (s.phone === false) { document.getElementById('ring').classList.remove('on'); document.getElementById('tap').classList.remove('on'); }
    setTimeout(function () { if (s.ring && s.phone !== false) ringOn(s.ring[0], s.ring[1]); }, 450);
    var t = STEPS.slice(0, i).reduce(function (a, b) { return a + b.secs; }, 0);
    document.getElementById('notes').innerHTML = '<div class="meta"><span>' + (i + 1) + ' of ' + STEPS.length + '</span><span>~' + s.secs + 's</span><span>should be at ' + fmt(t) + '</span></div>' + s.notes;
    if (!started && i > 0) started = Date.now();
    busy = false;
  }
  function fmt(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  setInterval(function () {
    var el = document.getElementById('timer'), sec = started ? (Date.now() - started) / 1000 : 0;
    el.textContent = fmt(sec) + ' / 4:00'; el.classList.toggle('over', sec > 240);
  }, 500);

  function playOpener() {
    var art = document.getElementById('bodyart'), op = document.getElementById('opener');
    if (!art) return;
    var t = function (ms, f) { setTimeout(function () { if (document.getElementById('bodyart') === art) f(); }, motionOK() ? ms : 0); };
    var trail = document.getElementById('trail'), len = trail.getTotalLength();
    trail.style.strokeDasharray = len; trail.style.strokeDashoffset = len;
    if (!motionOK()) { trail.style.strokeDashoffset = 0; art.classList.add('gone', 'born'); op.classList.add('done'); document.body.classList.add('intro-done'); return; }
    var tag = function (id, on) { var e = document.getElementById(id); if (e) e.classList.toggle('on', on); };
    t(300, function () { art.classList.add('b1', 'chew'); tag('tag1', true); });
    t(450, function () { art.classList.remove('chew'); });
    t(650, function () { art.classList.add('b2', 'chew'); });
    t(800, function () { art.classList.remove('chew'); });
    t(1000, function () {
      art.classList.add('gone'); tag('tag1', false);
      var b = document.getElementById('bolus'); b.setAttribute('opacity', '1');
      document.getElementById('travel').beginElement();
      trail.style.transition = 'stroke-dashoffset 3.4s cubic-bezier(.35,0,.65,1)'; trail.style.strokeDashoffset = 0;
    });
    t(1900, function () { art.classList.add('squish'); tag('tag2', true); });
    t(2300, function () { art.classList.remove('squish'); });
    t(2700, function () { tag('tag2', false); tag('tag3', true); });
    t(4300, function () { tag('tag3', false); document.getElementById('bolus').setAttribute('opacity', '0'); art.classList.add('born'); });
    t(4900, function () { op.classList.add('done'); });
    t(5500, function () { document.body.classList.add('intro-done'); });
  }

  function buildFidget() {
    var box = document.getElementById('fidget'); if (!box) return;
    var names = Object.keys(PLOOPY).filter(function (k) { return PLOOPY[k].hello && PLOOPY[k].cheer; });
    if (!names.length) { box.remove(); return; }
    box.innerHTML = names.map(function (k) {
      return '<button aria-label="Squish the ' + k + ' Ploopy" data-k="' + k + '"><img alt="" src="' + PLOOPY[k].hello + '" style="height:clamp(48px,6vw,100px)"></button>';
    }).join('');
    box.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var p = PLOOPY[b.dataset.k], img = b.querySelector('img');
      b.classList.remove('squish'); void b.offsetWidth; b.classList.add('squish');
      img.src = p.cheer; setTimeout(function () { img.src = p.hello; }, 700);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); show(i + 1, true); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); show(i - 1, false); }
    else if (k === 'n' || k === 'N') document.getElementById('notes').classList.toggle('on');
    else if (k === 't' || k === 'T') document.getElementById('timer').classList.toggle('on');
    else if (k === 'r' || k === 'R') { bootApp(STEPS[Math.max(i, 0)].route || 'home'); }
    else if (k === '?' || k === 'h' || k === 'H') document.getElementById('help').classList.toggle('on');
  });
  // keys keep working after someone taps the phone
  iframe.addEventListener('load', function () {
    try { iframe.contentDocument.addEventListener('keydown', function (e) {
      if (['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'n', 'N', 't', 'T', 'r', 'R', '?', 'h', 'H'].indexOf(e.key) >= 0) {
        e.preventDefault(); document.dispatchEvent(new KeyboardEvent('keydown', { key: e.key }));
      }
    }); } catch (err) {}
  });

  bootApp('home');
  fitPhone(); setTimeout(fitPhone, 300);
  show(0);
  document.getElementById('help').classList.add('on');
  setTimeout(function () { document.getElementById('help').classList.remove('on'); }, 5000);
  window.__pitch = { show: function (n) { return show(n, true); }, next: function () { return show(i + 1, true); }, get i() { return i; } };
})();
</script>
