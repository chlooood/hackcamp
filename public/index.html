<title>Plop</title>
<style>

    --gold:#F2B705; --gold-pale:#FFF3C4; --night:#141C30; --red:#C0312B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #FFFFFF; color: var(--ink); font-family: 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body.dark { background: #191D20; }
  body.night { background: #171E33; }
  body.slip { background: #252B3B; }
  button { font-family: inherit; color: inherit; cursor: pointer; }
  a { color: var(--teal); }
  :focus-visible { outline: 3px solid #1747E6; outline-offset: 2px; border-radius: 8px; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; }
  .screen { padding: max(44px, env(safe-area-inset-top)) 20px 32px; display: flex; flex-direction: column; gap: 18px; }

  h2 { margin: 0; font-size: 17px; font-weight: 900; }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; }
  .sub { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.4; }
  .hr { height: 1px; background: var(--line); }
  .link { background: none; border: 0; padding: 0; font-size: 13px; font-weight: 800; color: var(--teal); text-decoration: underline; min-height: 32px; }
  .icon-btn { width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; background: none; border: 0; border-radius: 999px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; width: 100%; border: 0; border-radius: 16px; font-size: 18px; font-weight: 900; text-decoration: none; }
  .btn-teal { background: var(--teal); color: #FFFFFF; box-shadow: 0 8px 18px rgba(13,148,136,0.28); }
  .btn-teal:disabled { background: #9FCFCB; box-shadow: none; cursor: default; }
  .btn-yellow { background: #F8C840; color: #3C3C3C; }
  .btn-outline { background: #FFFFFF; color: var(--teal-dark); border: 2px solid var(--teal); }
  .pill { font-size: 13px; font-weight: 900; padding: 3px 10px; border-radius: 999px; }
  .card { background: var(--card); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .seg { display: flex; background: var(--card); border-radius: 999px; padding: 4px; }
  .seg button { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 0; font-size: 14px; font-weight: 800; background: transparent; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: #FFFFFF; color: var(--ink); box-shadow: 0 1px 4px rgba(16,24,40,0.12); }
  .seg.small button { min-height: 32px; padding: 0 10px; font-size: 12px; }
  .toggle { width: 52px; height: 32px; border-radius: 999px; border: 0; padding: 3px; display: flex; flex-shrink: 0; background: #D3D9D9; justify-content: flex-start; transition: background .18s; }
  .toggle span { width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF; display: block; transition: transform .18s cubic-bezier(.2,.8,.2,1); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .toggle[aria-pressed="true"] { background: var(--teal); }
  .toggle[aria-pressed="true"] span { transform: translateX(20px); }
  .toggle.indigo[aria-pressed="true"] { background: var(--indigo); }
  .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #1E1E1E; color: #FFFFFF; font-size: 14px; font-weight: 800; padding: 10px 16px; border-radius: 14px; z-index: 50; max-width: calc(100% - 40px); text-align: center; }

  /* bottom nav */
  nav.main { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); width: calc(min(480px, 100%) - 28px); height: 66px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 8px 24px rgba(16,24,40,0.16); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px; z-index: 20; }
  nav.main a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 800; color: var(--muted); text-decoration: none; border-radius: 18px; }
  nav.main a[aria-current="page"] { font-weight: 900; }
  nav.main a.cam span { width: 58px; height: 58px; margin-top: -30px; border-radius: 999px; background: var(--teal); border: 4px solid #FFFFFF; box-shadow: 0 6px 14px rgba(13,148,136,0.45); display: flex; align-items: center; justify-content: center; }

  /* home */
  .chip-bar { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 999px; padding: 7px 12px; font-size: 15px; font-weight: 900; }
  .hero { background: var(--teal-soft); border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 92px; }
  .week > div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 92px; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tiles > div { border-radius: 16px; padding: 10px; display: flex; flex-direction: column; }
  .tiles b { font-size: 22px; font-weight: 900; line-height: 1.1; }
  .tiles span { font-size: 12px; font-weight: 800; }
  .quest { display: flex; align-items: center; gap: 12px; min-height: 36px; }
  .quest-btn { width: 100%; background: none; border: 0; padding: 4px 0; min-height: 44px; color: inherit; }
  .qbox { width: 26px; height: 26px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 900; color: #FFFFFF; }

  /* scan */
  .scan { background: #191D20; color: #FFFFFF; min-height: 100vh; min-height: 100dvh; }
  .scan .screen { align-items: stretch; }
  .viewfinder { position: relative; aspect-ratio: 350 / 480; width: 100%; background: #262B2E; border-radius: 28px; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; color: #A8B2B2; font-weight: 800; font-size: 15px; }
  .viewfinder video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .corner { position: absolute; width: 44px; height: 44px; border: 4px solid #5EEAD4; z-index: 2; }
  .corner.tl { top: 32px; left: 32px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .corner.tr { top: 32px; right: 32px; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  .corner.bl { bottom: 32px; left: 32px; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  .corner.br { bottom: 32px; right: 32px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
  .shutter { width: 84px; height: 84px; border-radius: 999px; border: 6px solid #FFFFFF; background: transparent; padding: 6px; align-self: center; }
  .shutter span { display: block; width: 100%; height: 100%; border-radius: 999px; background: #FFFFFF; }
  .shutter:disabled { opacity: .45; }
  .viewfinder img#still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  .vf-msg { position: relative; z-index: 2; padding: 0 28px; line-height: 1.5; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .vf-msg button { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid #5EEAD4; background: transparent; color: #FFF; font-size: 15px; font-weight: 800; }
  .cam-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .cam-side { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; min-height: 56px; background: none; border: 0; color: #FFF; font-size: 13px; font-weight: 800; }
  .cam-side:first-child { justify-self: start; } .cam-row > :last-child, #flip { justify-self: end; }
  .reading { position: absolute; inset: 0; background: rgba(25,29,32,0.82); display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; z-index: 3; color: #FFFFFF; font-size: 18px; font-weight: 900; }
  @media (prefers-reduced-motion: no-preference) {
    .bob { animation: bob 1s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0) } to { transform: translateY(-8px) } }
    .pop { animation: pop .35s ease-out; }
    @keyframes pop { from { transform: scale(.92); opacity: .3 } to { transform: none; opacity: 1 } }
    /* tap feedback */
    button, a { transition: transform .09s ease-out; }
    button:active:not(:disabled), a:active { transform: scale(.96); }
    /* screen entrance: children of a screen rise in, staggered from JS */
    .rise { animation: rise .42s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    /* selection pop on chips, types, comfort, blood */
    .pop-sm { animation: popsm .28s cubic-bezier(.3,1.6,.5,1); }
    @keyframes popsm { 0% { transform: scale(.9) } 100% { transform: scale(1) } }
    /* bars */
    .grow { transform-origin: bottom; animation: growY .6s cubic-bezier(.2,.8,.2,1) both; }
    .grow-down { transform-origin: top; animation: growY .6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes growY { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    .cell-in { animation: cellin .35s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes cellin { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: none } }
    /* mascot */
    .wiggle { animation: wiggle .6s ease-in-out; transform-origin: 50% 90%; }
    @keyframes wiggle { 0%,100% { transform: rotate(0) } 20% { transform: rotate(-9deg) scale(1.05) } 45% { transform: rotate(7deg) } 70% { transform: rotate(-4deg) } }
    .hop { animation: hop .7s cubic-bezier(.3,1.5,.5,1) both; }
    @keyframes hop { 0% { transform: translateY(30px) scale(.7); opacity: 0 } 60% { transform: translateY(-10px) scale(1.04); opacity: 1 } 100% { transform: none } }
    /* rank emblems */
    .drop { animation: drop .8s cubic-bezier(.3,1.4,.5,1) .15s both; }
    @keyframes drop { 0% { transform: translateY(-60px) rotate(-12deg) scale(.6); opacity: 0 } 100% { transform: none; opacity: 1 } }
    .shake { animation: shake .55s ease-in-out .3s both; }
    @keyframes shake { 0%,100% { transform: none } 20% { transform: translateX(-8px) rotate(-3deg) } 40% { transform: translateX(7px) rotate(2deg) } 60% { transform: translateX(-5px) } 80% { transform: translateX(3px) } }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 0 rgba(242,183,5,0)) } 50% { filter: drop-shadow(0 0 18px rgba(242,183,5,.55)) } }
    /* scanning */
    /* Ploopy idle life */
    .p-body { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1, 1) } 50% { transform: scale(1.03, .965) } }
    .p-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5s infinite; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.08) } }
    .p-happy { transform-box: fill-box; transform-origin: 50% 100%; animation: squint 2.4s ease-in-out infinite; }
    @keyframes squint { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) } }
    .p-pupils { transition: transform .22s cubic-bezier(.2,.8,.2,1); }
    .squish { animation: squish .45s cubic-bezier(.3,1.6,.5,1); transform-origin: 50% 100%; }
    @keyframes squish { 0% { transform: scale(1) } 30% { transform: scale(1.18, .78) } 60% { transform: scale(.92, 1.1) } 100% { transform: scale(1) } }
    .jump { animation: jump .9s cubic-bezier(.3,1.3,.5,1); transform-origin: 50% 100%; }
    @keyframes jump { 0% { transform: none } 20% { transform: scale(1.1, .85) } 50% { transform: translateY(-26px) scale(.95, 1.08) } 75% { transform: translateY(0) scale(1.08, .92) } 100% { transform: none } }
    .sweep { position: absolute; left: 8%; right: 8%; height: 3px; border-radius: 3px; background: #5EEAD4; box-shadow: 0 0 16px 4px rgba(94,234,212,.6); animation: sweep 1.4s ease-in-out infinite alternate; top: 12%; }
    @keyframes sweep { from { top: 12% } to { top: 86% } }
    .flash { position: absolute; inset: 0; background: #FFFFFF; z-index: 4; pointer-events: none; animation: flash .35s ease-out forwards; }
    @keyframes flash { from { opacity: .9 } to { opacity: 0 } }

  .mascot-btn { position: relative; background: none; border: 0; padding: 0; flex-shrink: 0; border-radius: 20px; }
  .bubble { position: absolute; right: 70%; top: -18px; background: #FFFFFF; color: var(--ink); font-size: 13px; font-weight: 800; padding: 6px 10px; border-radius: 12px; white-space: nowrap; box-shadow: 0 4px 14px rgba(16,24,40,.14); opacity: 0; transform: translateY(6px) scale(.9); transition: opacity .18s, transform .18s; pointer-events: none; z-index: 2; }
  .bubble.show { opacity: 1; transform: none; }
  .fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 60; overflow: hidden; }

  /* result */
  .score-card { position: relative; background: var(--teal); border-radius: 28px; padding: 20px 18px 18px; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .score-card .blob { position: absolute; right: -40px; top: -40px; width: 190px; height: 190px; border-radius: 999px; background: #14A396; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { min-height: 38px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 800; }
  .comfort { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .comfort button { min-height: 46px; padding: 0 4px; border-radius: 14px; font-size: 14px; font-weight: 800; background: #FFFFFF; border: 2px solid var(--track); }

  /* pick */
  .types button { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 4px 12px; margin: 0 -12px; border-radius: 14px; border: 0; text-align: left; background: transparent; width: calc(100% + 24px); }
  .types button[aria-pressed="true"] { background: var(--teal-soft); box-shadow: inset 0 0 0 2px var(--teal); }
  .banner { background: #FEF6D3; border-radius: 18px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 800; color: #5C4500; }
  .banner button { background: none; border: 0; color: #5C4500; font-weight: 900; text-decoration: underline; font-size: 15px; min-height: 40px; }
  .sticky-bottom { position: sticky; bottom: 0; padding: 16px 0 max(16px, env(safe-area-inset-bottom)); background: linear-gradient(rgba(255,255,255,0), #FFFFFF 30%); }

  /* checked in */
  .tip { display: flex; align-items: center; gap: 12px; }
  .tip .ic { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .tip button { min-height: 40px; padding: 0 16px; border-radius: 12px; font-size: 14px; font-weight: 800; flex-shrink: 0; background: #FFFFFF; color: var(--teal-dark); border: 2px solid var(--teal-pale); }
  .tip button[aria-pressed="true"] { background: var(--teal); color: #FFFFFF; border-color: var(--teal); }

  /* tiers / lists */
  .list-row { display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: 0; }
  .avatar { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 17px; color: #FFFFFF; flex-shrink: 0; }
  .avatar svg { margin-top: 6px; }
  @media (prefers-reduced-motion: no-preference) {
    .pal { display: block; }
    .pal-a { animation: palA 2.8s ease-in-out infinite; }
    .pal-b { animation: palB 2.8s ease-in-out infinite; }
    @keyframes palA { 0%,100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-4px) rotate(-3deg) } }
    @keyframes palB { 0%,100% { transform: translateY(-4px) rotate(2deg) } 50% { transform: translateY(0) rotate(0) } }
  }
  .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 62px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 800; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; padding: 0; }

  /* record */
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .cal > div { position: relative; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; font-weight: 800; color: var(--muted); }
  .legend span { display: flex; align-items: center; gap: 4px; }
  textarea { border: 2px solid var(--track); border-radius: 14px; padding: 12px; font-family: inherit; font-size: 16px; font-weight: 600; background: #FFFFFF; resize: vertical; color: var(--ink); }
  details.demo { border: 2px dashed var(--track); border-radius: 18px; padding: 4px 14px; }
  details.demo summary { min-height: 44px; display: flex; align-items: center; font-weight: 900; cursor: pointer; }
  details.demo label { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; font-size: 15px; }
  details.demo input { width: 20px; height: 20px; accent-color: var(--teal); }
  .demo-btn { min-height: 44px; border-radius: 12px; border: 2px solid var(--track); background: #FFFFFF; font-size: 14px; font-weight: 800; width: 100%; margin: 4px 0; }

  @media print {
    nav.main, .no-print, details.demo { display: none !important; }
    .screen.with-nav { padding-bottom: 0; }
  }
</style>

    window.addEventListener('online', flush);
    return {
      on: on, boot: boot, flush: flush, statusText: statusText, refreshBuddies: refreshBuddies,
      entry: function (e) { queue({ op: 'entry', row: entryRow(e) }); },
      delEntry: function (day) { queue({ op: 'delEntry', day: day }); },
      gp: function (day, delta, reason) { queue({ op: 'gp', row: { day: day, delta: delta, reason: reason } }); },
      rank: function () { queue({ op: 'profile', patch: { tier: state.tier, div: state.div, gp: state.gp } }); },
      profile: function (patch) { queue({ op: 'profile', patch: patch }); },
      cheer: function (to, isOn) { queue({ op: 'cheer', to: to, day: today(), on: isOn }); },
      demoJoin: async function () { var r = await api({ op: 'demoJoin', today: today() }); setBuddies(r.buddies); return r.added; },
      removeBuddy: async function (id) { var r = await api({ op: 'remove', buddy: id, today: today() }); setBuddies(r.buddies); },
      deleteMe: async function () { await api({ op: 'deleteMe' }); },
      // This week's real board from Tiger (weekly_deuces). Re-renders Global when it arrives.
      loadBoard: function () {
        if (!on()) { BOARD = null; return; }
        api({ op: 'board', today: today() }).then(function (r) {
          BOARD = r.ok && r.rows && r.rows.length ? r.rows : null;
          if (current() === 'global' && BOARD) render();
        }).catch(function () {});
      },
      inviteLink: function () { return state.inviteCode ? location.origin + location.pathname + '?invite=' + state.inviteCode : null; }
    };
  })();

  // Buddies to show: real ones from the database in cloud mode, the seeded ones in demo mode.
  function buddyList() {
    if (source === 'cloud') return state.buddies || [];
    return BUDDIES.filter(function (b) { return !state.removed[b.name]; }).map(function (b) {
      return Object.assign({ id: b.name, loggedToday: !!b.time, demo: true }, b);
    });
  }

  // ---------- events ----------
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('button, a[data-go], [data-act]');
    // Tapping Ploopy anywhere (outside a button) gives it a squish
    var ploopy = ev.target.closest('svg[aria-label^="Ploopy"]');
    if (ploopy && !el) { squishPloopy(ploopy); return; }
    if (!el) return;
    var ds = el.dataset;
    if (ds.go) { ev.preventDefault(); go(ds.go); return; }
    if (ds.back) { ev.preventDefault(); go(ds.back); return; }
    if (ds.chip) { var i = draft.chips.indexOf(ds.chip); if (i >= 0) draft.chips.splice(i, 1); else draft.chips.push(ds.chip); buzz(6); render('[data-chip="' + ds.chip + '"]'); return; }
    if (ds.comfort) { draft.comfort = Number(ds.comfort); buzz(6); render('[data-comfort="' + ds.comfort + '"]'); return; }
    if (ds.type) { draft.type = Number(ds.type); buzz(6); render('[data-type="' + ds.type + '"]'); return; }
    if (ds.tip) {
      var k = today() + ds.tip;
      if (state.tipsDone[k]) {
        if (!confirm('Mark this task as not done?')) return;
        delete state.tipsDone[k];
        if (state.mode === 'ranked') { applyGp(-4); state.gpLog[today()] = (state.gpLog[today()] || 0) - 4; cloud.gp(today(), -4, 'task undone'); cloud.rank(); }
        save(); render('[data-tip="' + ds.tip + '"]'); return;
      }
      snapTask = { i: Number(ds.tip), back: current() === 'checked' ? 'checked' : 'tasks' };
      go('snap'); return;
    }
    if (ds.cheer) {
      var ck = today() + ds.cheer, cheerRect = rectOf(el);
      var who = buddyList().filter(function (b) { return String(b.id) === ds.cheer; })[0];
      var nowOn = !state.cheered[ck];
      if (!nowOn) delete state.cheered[ck];
      else { state.cheered[ck] = true; buzz(15); floatFrom(cheerRect, ['🎉', '👏', '💩', '🙌', '✨'], { size: 24 }); toast((who ? who.name : 'They') + ' gets a cheer'); }
      if (who && !who.demo) cloud.cheer(who.id, nowOn);
      save(); render('[data-cheer="' + ds.cheer + '"]'); return;
    }
    if (ds.mode) {
      if (ds.mode === 'ranked' && !state.leagueJoined) { go('join'); return; }
      state.mode = ds.mode; cloud.profile({ mode: ds.mode }); save(); render(); return;
    }
    if (ds.join) {
      if (ds.join === 'rank') { state.privacy.rank = !state.privacy.rank; cloud.profile({ share_rank: state.privacy.rank }); el.setAttribute('aria-pressed', String(state.privacy.rank)); }
      else { state.globalOn = !state.globalOn; cloud.profile({ global_on: state.globalOn }); el.setAttribute('aria-pressed', String(state.globalOn)); }
      save(); buzz(6); return;
    }
    if (ds.cal) { recordMode = ds.cal; var y3 = window.scrollY; render(); window.scrollTo(0, y3); return; }
    if (ds.priv) {
      state.privacy[ds.priv] = !state.privacy[ds.priv]; save(); buzz(6);
      var col = { checkin: 'share_checkin', streak: 'share_streak', rank: 'share_rank', discreet: 'discreet' }[ds.priv], patch = {};
      patch[col] = state.privacy[ds.priv]; cloud.profile(patch);
      el.setAttribute('aria-pressed', String(state.privacy[ds.priv])); // slide the knob, then re-render
      setTimeout(function () { render(); }, motionOK() ? 200 : 0); return;
    }
    if (ds.remove) {
      var gone = buddyList().filter(function (b) { return String(b.id) === ds.remove; })[0];
      if (!gone || !confirm('Remove ' + gone.name + '? They won\'t be told.')) return;
      if (gone.demo) { state.removed[gone.name] = true; save(); toast(gone.name + ' removed'); render(); return; }
      cloud.removeBuddy(gone.id).then(function () { toast(gone.name + ' removed'); render(); })
        .catch(function () { toast("Couldn't remove right now. Try again with signal."); });
      return;
    }
    if (ds.mascot) { state.mascot = ds.mascot; cloud.profile({ mascot: ds.mascot }); save(); var y4 = window.scrollY; render(); window.scrollTo(0, y4); document.querySelector('details.demo').open = true; return; }
    if (el.id === 'shutter') { onShutter(); return; }
    switch (ds.act) {
      case 'skip': draft = { source: 'pick', chips: [], comfort: 0, type: 0 }; go('pick'); break;
      case 'upload': document.getElementById('upload').click(); break;
      case 'snap-cancel': var bk = snapTask ? snapTask.back : 'tasks'; snapTask = null; go(bk); break;
      case 'native-cam': document.getElementById('file').click(); break;
      case 'retry-cam': startCamera(); break;
      case 'flip': camFacing = camFacing === 'environment' ? 'user' : 'environment'; stopCamera(); startCamera(); break;
      case 'cancel': draft = null; go('home'); break;
      case 'plain': state.plain = !state.plain; cloud.profile({ plain_names: state.plain }); save(); render(); break;
      case 'savename':
        var nm = (document.getElementById('my-name') || {}).value || '';
        nm = nm.trim().slice(0, 40);
        if (!nm) { toast('Type a name first'); break; }
        state.name = nm; cloud.profile({ display_name: nm }); save(); toast('Buddies will see you as ' + nm); render();
        break;
      case 'blood': draft.blood = !draft.blood; draft.bloodByUser = draft.blood; buzz(10); render('[data-act="blood"]'); break;
      case 'poke': poke(); break;
      case 'checkin':
        state.todayTips = { day: today(), tips: draft.tips || [] };
        commit({ date: today(), kind: 'scan', score: draft.score, type: draft.guess.bristol, colour: draft.guess.colour, confidence: draft.guess.confidence, comfort: draft.comfort, chips: draft.chips.slice(), blood: !!draft.blood });
        break;
      case 'logpick':
        if (!draft.type) return;
        commit({ date: today(), kind: 'pick', score: null, type: draft.type, comfort: draft.comfort || 0, chips: draft.chips || [], blood: false });
        break;
      case 'continue': var promo = lastCheckin && lastCheckin.promoted; lastCheckin = null; go(promo ? 'promoted' : 'home'); break;
      case 'share':
        var text = 'I made it to ' + curRank() + ' on Plop. Day ' + streak() + '.';
        if (navigator.share) navigator.share({ text: text }).catch(function () {}); else { copy(text); toast('Copied to share'); }
        break;
      case 'invite':
        var link = cloud.on() ? cloud.inviteLink() : location.origin + location.pathname + '?invite=demo';
        if (!link) { toast('Still connecting. Try again in a moment.'); break; }
        if (cloud.on() && !state.name) { toast('Add your name first so they know who it is'); break; }
        if (navigator.share) navigator.share({ title: 'Plop', text: 'Did you plop today? Join my circle.', url: link }).catch(function () {}); else { copy(link); toast('Invite link copied'); }
        break;
      case 'global':
        state.globalOn = !state.globalOn; cloud.profile({ global_on: state.globalOn }); save(); buzz(6);
        setTimeout(cloud.loadBoard, 1200);
        el.setAttribute('aria-pressed', String(state.globalOn));
        setTimeout(function () { render(); }, motionOK() ? 200 : 0);
        break;
      case 'showall': toast(liveBoard() ? 'Showing the top 12 this week' : 'Full board comes with the real backend'); break;
      case 'pause': state.paused = !state.paused; cloud.profile({ paused: state.paused }); save(); toast(state.paused ? 'Break on. Buddies see nothing new.' : 'Welcome back'); render(); break;
      case 'remove': document.getElementById('remove-list').classList.toggle('hidden'); break;
      case 'wipe':
        if (!confirm(cloud.on()
          ? 'Delete everything? Your account, log, rank, buddies and settings are deleted from the database and this phone. This can\'t be undone.'
          : 'Delete everything? Your log, rank and settings are wiped from this phone. This can\'t be undone.')) break;
        var wipeLocal = function () {
          try { localStorage.removeItem(storeKey()); } catch (e) {}
          state = emptyState(); save(); draft = null; lastCheckin = null;
          toast('Everything deleted'); go('home');
        };
        if (cloud.on()) {
          cloud.deleteMe().then(function () {
            try { localStorage.removeItem(storeKey()); localStorage.setItem('plop-source', 'demo'); } catch (e) {}
            location.href = '/api/auth/logout';   // also ends the Auth0 session
          }).catch(function () { toast("Couldn't reach your account, so nothing was deleted. Try again with signal."); });
        } else wipeLocal();
        break;
      case 'widget': toast('Use your browser\'s Share menu, then Add to Home Screen'); break;
      case 'pdf': window.print(); break;
      case 'slip': simulateSlip(); break;
      case 'promote-demo': go('promoted'); break;
      case 'reseed':
        if (source === 'cloud') { setSource('demo'); }
        else { state = seed(); }
        save(); toast('Demo data on this phone'); render(); break;
      case 'demo-join':
        cloud.demoJoin().then(function (n) { toast(n ? 'Zan, Chloe and Mo are your buddies now' : 'They are already your buddies'); render(); })
          .catch(function (e) { toast(e.message === 'seed_missing' ? 'Run db/seed.sql in Supabase first' : "Couldn't reach your account"); });
        break;
      case 'use-cloud':
        setSource('cloud'); render(); cloud.boot(); break;
      case 'logout':
        try { localStorage.setItem('plop-source', 'demo'); localStorage.setItem('plop-chose-demo', ''); } catch (e) {}
        location.href = '/api/auth/logout'; break;
      case 'try-demo':
        try { localStorage.setItem('plop-chose-demo', '1'); } catch (e) {}
        setSource('demo'); loginError = null; go('home'); break;
      case 'join-ranked':
        state.leagueJoined = true; state.mode = 'ranked';
        cloud.profile({ league_joined: true, mode: 'ranked' }); save(); buzz([15, 40, 15]);
        go('ranked'); setTimeout(function () { confetti(40, 0.25); }, 300); toast("You're in. Good luck this week."); break;
      case 'stay-casual': go('ranked'); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.name === 'scanmode') { state.scanMode = t.value; save(); }
    if (t.id === 'force-unclear') { state.forceUnclear = t.checked; save(); }
  });
  // Both the phone-camera input and the gallery upload end up here.
  ['file', 'upload'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', async function (e) {
      var f = e.target.files && e.target.files[0]; e.target.value = '';
      if (!f) return;
      if (current() === 'snap') {
        try { await fileToJpeg(f); shutterFlash(); completeSnap(); } catch (err) { toast("Couldn't open that photo. Try a JPG or PNG."); }
        return;
      }
      if (current() !== 'scan') go('scan');
      try { var b64 = await fileToJpeg(f); shutterFlash(); runScan(b64); }
      catch (err) { draft = { source: 'failed', reason: "Couldn't open that photo. Try a JPG or PNG.", chips: [], comfort: 0, type: 0 }; go('pick'); }
    });
  });
  function shutterFlash() {
    buzz(20);
    var vf = document.getElementById('vf');
    if (!vf || !motionOK()) return;
    var f = document.createElement('div'); f.className = 'flash'; vf.appendChild(f);
    setTimeout(function () { f.remove(); }, 400);
  }
  function onShutter() {
    if (current() === 'snap') {
      if (grabFrame()) { shutterFlash(); completeSnap(); return; }
      document.getElementById('file').click(); return;
    }
    if (state.scanMode === 'cached' || state.forceUnclear) { shutterFlash(); runScan(null); return; }
    var b64 = grabFrame();
    if (b64) { shutterFlash(); runScan(b64); return; }
    // No live camera (blocked, http link, none found): use the phone's own camera app instead.
    document.getElementById('file').click();
  }
  var POKES = ['Hey, that tickles.', 'Everybody plops.', 'No judgement here.', 'Ready when you are.', 'Psst. Zan checked in.', 'Photo time?', 'Still here. Still round.'];
  var pokeIdx = 0, bubbleTimer = null;
  function poke() {
    var p = document.getElementById('ploopy'), b = document.getElementById('bubble');
    if (!p || !b) return;
    buzz(10);
    var moves = ['squish', 'wiggle', 'jump'], mv = moves[pokeIdx % moves.length];
    moves.forEach(function (c) { p.classList.remove(c); }); void p.offsetWidth; p.classList.add(mv);
    b.textContent = loggedToday() && pokeIdx % 3 === 0 ? 'Day ' + streak() + '. Nice.' : POKES[pokeIdx % POKES.length];
    pokeIdx++;
    b.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function () { b.classList.remove('show'); }, 1800);
  }
  function simulateSlip() {
    var yest = dayStr(addDays(new Date(), -1));
    var before = [state.tier, state.div];
    var res = applyGp(-30);
    state.gpLog[yest] = -30;
    state.entries = state.entries.filter(function (e) { return e.date !== yest; });
    cloud.gp(yest, -30, 'missed day (demo switch)'); cloud.delEntry(yest); cloud.rank();
    state.lastSlip = { day: new Date(yest + 'T12:00').toLocaleDateString('en-US', { weekday: 'long' }), miss: 20, streak: 10, from: before, to: [state.tier, state.div] };
    save();
    state.lastSlip.dropped = res.dropped; save();
    go('deranked');
  }
  function copy(text) { try { navigator.clipboard.writeText(text); } catch (e) {} }

  render();
  cloud.boot();
})();
</script>
</body>
</html>
